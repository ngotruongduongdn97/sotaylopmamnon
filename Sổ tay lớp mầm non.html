<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* Layout: thanh điều hướng 6 sản phẩm bên trái, mỗi sản phẩm là một màn làm việc; mobile chuyển thành thanh cuộn ngang */
:root {
  --bg: #f1f6f5;
  --surface: #ffffff;
  --ink: #16302c;
  --muted: #587069;
  --line: #d5e2df;
  --accent: #0d7a6b;
  --accent-ink: #ffffff;
  --accent-soft: #dcf0ec;
  --sun: #f0a500;
  --sun-soft: #fff0c4;
  --danger: #b3372b;
  --danger-ink: #ffffff;
  --l1: #e8a09a; --l2: #f2cf7a; --l3: #8fcfb8; --l4: #3fa58f;
  --m-vui: #f0a500; --m-haohuc: #e2704f; --m-binhtinh: #3fa58f; --m-buon: #6d86c9;
  --font-display: "Baloo 2", "Be Vietnam Pro", system-ui, sans-serif;
  --font-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1a18; --surface: #15262a; --ink: #e3f0ed; --muted: #93aca6; --line: #26403f;
    --accent: #4cc2ad; --accent-ink: #06201c; --accent-soft: #1c3a38; --sun: #f5b82e; --sun-soft: #3a3012;
    --danger: #f08a7e; --danger-ink: #2a0d09;
    --l1: #b8665f; --l2: #b8923a; --l3: #3f8f78; --l4: #4cc2ad;
    --m-vui: #f5b82e; --m-haohuc: #ee8a6b; --m-binhtinh: #4cc2ad; --m-buon: #8aa1de;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1a18; --surface: #15262a; --ink: #e3f0ed; --muted: #93aca6; --line: #26403f;
  --accent: #4cc2ad; --accent-ink: #06201c; --accent-soft: #1c3a38; --sun: #f5b82e; --sun-soft: #3a3012;
  --danger: #f08a7e; --danger-ink: #2a0d09;
  --l1: #b8665f; --l2: #b8923a; --l3: #3f8f78; --l4: #4cc2ad;
  --m-vui: #f5b82e; --m-haohuc: #ee8a6b; --m-binhtinh: #4cc2ad; --m-buon: #8aa1de;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.6 var(--font-body); padding-inline: 16px; padding-block: 20px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

.app { max-width: 1120px; margin-inline: auto; display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 28px; align-items: start; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); display: flex; flex-direction: column; gap: 18px; padding-block: 4px; }
.brand h1 { font-size: 1.7rem; font-weight: 800; color: var(--accent); }
.brand p { color: var(--muted); font-size: .85rem; margin-top: 4px; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav button { text-align: left; background: none; border: 0; border-radius: 10px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.nav button:hover { background: var(--accent-soft); }
.nav button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.nav b { font: 700 1rem/1.2 var(--font-display); }
.nav span { font-size: .78rem; opacity: .8; }

.main { min-width: 0; }
.head { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
.eyebrow { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.head h2 { font-size: clamp(1.7rem, 4vw, 2.4rem); font-weight: 800; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 18px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
label { display: flex; flex-direction: column; gap: 5px; font-size: .85rem; font-weight: 500; color: var(--muted); }
input, select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; width: 100%; min-width: 0; color: var(--ink); }
input[type="file"] { padding: 7px; }
textarea { resize: vertical; min-height: 78px; }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 9px; padding: 10px 16px; font-weight: 600; cursor: pointer; }
.btn:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .4; cursor: not-allowed; filter: none; }
.btn.ghost { background: none; color: var(--accent); border: 1px solid var(--line); }
.btn.small { padding: 6px 11px; font-size: .85rem; }
.btn.mini { padding: 1px 9px; font-size: .74rem; border-radius: 99px; }
.btn.danger { color: var(--danger); }
.btn.danger.on { background: var(--danger); color: var(--danger-ink); border-color: var(--danger); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 5px 13px; cursor: pointer; font-size: .86rem; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pill { display: inline-block; border-radius: 99px; padding: 1px 10px; font-size: .75rem; font-weight: 600; background: var(--accent-soft); color: var(--accent); }
.pill.sun { background: var(--sun-soft); color: var(--ink); }
.muted { color: var(--muted); }
.hint { font-size: .8rem; color: var(--muted); }
.empty { color: var(--muted); text-align: center; padding: 26px 8px; border: 1px dashed var(--line); border-radius: 12px; }
.x { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 1.1rem; line-height: 1; padding: 2px 6px; border-radius: 6px; }
.x:hover { color: var(--ink); background: var(--bg); }
h3.sec { font-size: 1.1rem; }

/* kế hoạch */
.editor { display: flex; flex-direction: column; gap: 14px; }
.editor h4 { font: 700 1rem var(--font-display); margin: 4px 0 -6px; color: var(--accent); }
.titlein { font: 700 1.3rem var(--font-display); }
.stepedit { border-top: 1px solid var(--line); padding-top: 12px; display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; gap: 8px; align-items: start; }
.stepedit .stack { gap: 6px; min-width: 0; }
.saved { display: flex; flex-direction: column; gap: 8px; }
.saved .it { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 6px 6px 12px; background: var(--bg); }
.saved .it button.open { flex: 1; min-width: 0; text-align: left; background: none; border: 0; cursor: pointer; padding: 4px 0; }
.saved .it b { display: block; font-size: .9rem; overflow-wrap: anywhere; }
.saved .it span { font-size: .76rem; color: var(--muted); }

/* học liệu */
.lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.thumb { height: 76px; display: flex; align-items: center; justify-content: center; font: 800 1.9rem var(--font-display); color: var(--ink); }
.thumb.t-video { background: var(--sun-soft); }
.thumb.t-anh { background: var(--accent-soft); }
.thumb.t-game { background: color-mix(in srgb, var(--m-buon) 25%, var(--surface)); }
.thumb.media { height: 150px; background: var(--bg); padding: 0; }
.thumb img, .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.ph { height: auto; min-height: 76px; font: 500 .8rem/1.4 var(--font-body); color: var(--muted); text-align: center; padding: 10px 12px; background: var(--sun-soft); }
.card .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.card h3 { font-size: 1.05rem; }
.card .foot { display: flex; justify-content: space-between; align-items: center; margin-top: auto; gap: 6px; flex-wrap: wrap; }
.card .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.group { display: flex; flex-direction: column; gap: 10px; }
.group > h3 { font-size: 1.2rem; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

/* hồ sơ + nhật ký + kênh */
.list { display: flex; flex-direction: column; gap: 10px; }
.item { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 5px; background: var(--surface); min-width: 0; }
.item .top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.item h3 { font-size: 1.05rem; }
.item p { overflow-wrap: anywhere; }
.item .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: .82rem; color: var(--muted); }
.kid { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.kid .grow { flex: 1; min-width: 0; }
.avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--sun); color: #2a2100; display: flex; align-items: center; justify-content: center; font: 800 1.2rem var(--font-display); flex: none; }
.msg.teacher { border-left: 4px solid var(--accent); }
.msg.parent { border-left: 4px solid var(--sun); }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.missing { font-size: .82rem; color: var(--muted); }

/* bảng theo dõi */
.daybar { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.daybar label { flex: 0 1 190px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 640px; }
th, td { padding: 9px 10px; text-align: center; border-bottom: 1px solid var(--line); font-size: .88rem; }
th { font-weight: 600; color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; }
th:first-child, td:first-child { text-align: left; font-weight: 600; }
tr:last-child td { border-bottom: 0; }
.nm { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
.lvl { width: 100%; min-width: 46px; border: 0; border-radius: 8px; padding: 7px 0; font-weight: 700; cursor: pointer; color: #1b2a27; }
.lvl[data-v="1"], .lv[data-v="1"] { background: var(--l1); } .lvl[data-v="2"], .lv[data-v="2"] { background: var(--l2); }
.lvl[data-v="3"], .lv[data-v="3"] { background: var(--l3); } .lvl[data-v="4"], .lv[data-v="4"] { background: var(--l4); }
.lvl[data-v="0"], .lv[data-v="0"] { background: var(--bg); color: var(--muted); border: 1px dashed var(--line); }
.lv { display: inline-block; min-width: 32px; border-radius: 7px; padding: 2px 0; font-weight: 700; color: #1b2a27; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.bars { display: flex; flex-direction: column; gap: 9px; }
.bar { display: grid; grid-template-columns: 130px minmax(0, 1fr) 34px; gap: 10px; align-items: center; font-size: .86rem; }
.track { background: var(--bg); border-radius: 99px; height: 12px; overflow: hidden; }
.fill { height: 100%; background: var(--accent); border-radius: 99px; }
.moodpick { display: flex; gap: 8px; flex-wrap: wrap; }
.moodpick button { display: inline-flex; gap: 7px; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 99px; padding: 6px 13px; cursor: pointer; }
.moodpick button[aria-pressed="true"] { border-color: var(--ink); background: var(--surface); font-weight: 600; box-shadow: 0 0 0 2px var(--ink); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 99px; font-size: .88rem; z-index: 5; max-width: calc(100% - 32px); text-align: center; }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .side { position: static; }
  .nav { flex-direction: row; overflow-x: auto; padding-bottom: 6px; }
  .nav button { flex: none; width: 190px; }
  .nav span { display: none; }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .bar { grid-template-columns: 100px minmax(0, 1fr) 30px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script>

function today(off) { var d = new Date(); d.setDate(d.getDate() - (off || 0)); var m = d.getMonth() + 1, dd = d.getDate(); return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (dd < 10 ? "0" : "") + dd; }
function fmt(s) { var p = s.split("-"); return p[2] + "/" + p[1] + "/" + p[0]; }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function uid() { return "i" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function norm(s) { return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[đĐ]/g, "d").toLowerCase(); }

function seed() {
  var base = { "Minh Anh": [3, 3, 2, 4, 3], "Gia Bảo": [4, 3, 3, 2, 3], "Khánh Linh": [3, 4, 4, 3, 4], "Đức Huy": [2, 2, 3, 3, 2], "Bảo Châu": [3, 3, 3, 4, 4] };

      { t: "Đèn tín hiệu giao thông", th: "Giao thông", ty: "game", n: "Đèn xanh, đỏ, vàng: bé nên làm gì?", s: "" },
      { t: "Chú bộ đội, cô giáo, bác sĩ", th: "Nghề nghiệp", ty: "anh", n: "Tranh đồng phục và dụng cụ từng nghề", s: "" },
      { t: "Mưa từ đâu đến?", th: "Hiện tượng tự nhiên", ty: "video", n: "Clip hoạt hình 3 phút về vòng tuần hoàn nước", s: "" },
      { t: "Cây tre Việt Nam", th: "Quê hương – Bác Hồ", ty: "anh", n: "Ảnh lũy tre làng và đồ dùng làm từ tre", s: "" }
    ],

      { k: 0, d: today(3), t: "Xếp hàng chờ rửa tay", ty: "Hoạt động", n: "Chủ động nhường bạn nhỏ hơn đi trước." },
      { k: 1, d: today(6), t: "Xây cầu bằng khối gỗ", ty: "Sản phẩm", n: "Xếp được cầu 3 tầng, giải thích vì sao cầu không đổ." },

document.addEventListener("click", function (ev) {

    if (ui.pend === key) { var ki = +key.split(":")[1], nm = S.kids[ki]; clearPend(); removeKid(ki); render(); toast("Đã xóa " + nm + " khỏi sổ tay"); return; }

  }

  if (a === "copyplan") { copyText(planText(ui.plan)); return; }
  if (a === "dl") { doDownload(S.lib[i]); return; }
  if (a === "filter") { ui[b.dataset.k] = b.dataset.v; }

  if (a === "dellib") { var it = S.lib[i]; if (it && MEDIA[it.id]) { try { URL.revokeObjectURL(MEDIA[it.id].url); } catch (e) {} delete MEDIA[it.id]; } S.lib.splice(i, 1); save(); }
  if (a === "clrs") { S.lib[i].s = ""; save(); toast("Đã gỡ tên học sinh khỏi học liệu"); }
  if (a === "clrc") { S.chat[i].stu = false; S.chat[i].to = "Cả lớp"; save(); toast("Đã gỡ tên học sinh khỏi tin nhắn"); }
  if (a === "delprof") { S.prof.splice(i, 1); save(); }
  if (a === "delchat") { S.chat.splice(i, 1); save(); }
  if (a === "deldiary") { S.diary.splice(i, 1); save(); }
  if (a === "lvl") {
    var j = +b.dataset.j, n = S.kids[i];

    if (!prev) { toast("Chưa có ngày nào được lưu trước đó"); return; }
    S.hist[ui.day] = JSON.parse(JSON.stringify(S.hist[prev])); save(); toast("Đã lấy kết quả ngày " + fmt(prev) + ". Chỉnh lại theo hôm nay.");
  }
  if (a === "mood") { ui.mood = b.dataset.v; }
  if (a === "blankplan") { ui.plan = blankPlan(); }
  if (a === "addstep") { ui.plan.steps.push({ t: "", h: "", x: "" }); }
  if (a === "delstep") { ui.plan.steps.splice(i, 1); if (!ui.plan.steps.length) ui.plan.steps.push({ t: "", h: "", x: "" }); }

    if (cp.sid) { var k = S.plans.findIndex(function (z) { return z.sid === cp.sid; }); if (k >= 0) S.plans[k] = cp; else S.plans.push(cp); }
    else { cp.sid = uid(); ui.plan.sid = cp.sid; S.plans.push(cp); }
    var ok = save(); render(); toast(ok ? "Đã lưu kế hoạch" : "Bộ nhớ trình duyệt đầy, chưa lưu lâu dài được"); return;
  }
  if (a === "loadplan") { ui.plan = JSON.parse(JSON.stringify(S.plans[i])); toast("Đã mở kế hoạch để chỉnh sửa"); }
  if (a === "delplan") { var dead = S.plans[i]; S.plans.splice(i, 1); if (ui.plan && dead && ui.plan.sid === dead.sid) delete ui.plan.sid; save(); }
  render();
});
var PL_KEYS = { "pl-title": "title", "pl-sub": "sub", "pl-goals": "goals", "pl-prep": "prep", "pl-note": "note", "pl-ev": "ev" };
var CF_KEYS = { "ch-r": "role", "ch-p": "person", "ch-to": "to", "ch-k": "kid", "ch-x": "x" };
var SQ_KEYS = { "sq-n": "n", "sq-f": "from", "sq-t": "to" };
function sync(ev) {
  var t = ev.target, id = t.id || "", m;
  if (id === "kidSel") { if (ev.type === "change") { ui.kid = +t.value; render(); } return; }
  if (id === "tb-d") { if (ev.type === "change") { ui.day = t.value || today(); render(); } return; }
  if (SQ_KEYS[id]) { ui.sq[SQ_KEYS[id]] = t.value; renderSearch(); return; }
  if (ui.plan && PL_KEYS[id]) { ui.plan[PL_KEYS[id]] = t.value; return; }
  if (ui.plan && (m = id.match(/^pl-st-(\d+)-([thx])$/))) { if (ui.plan.steps[+m[1]]) ui.plan.steps[+m[1]][m[2]] = t.value; return; }
  if (CF_KEYS[id]) {
    ui.cf[CF_KEYS[id]] = t.value;
    if (ev.type === "change" && (id === "ch-r" || id === "ch-to")) render(); else updateChat();
  }
}
document.addEventListener("input", sync);
document.addEventListener("change", sync);
document.addEventListener("submit", function (ev) {
  ev.preventDefault();
  var id = ev.target.id, v = function (x) { return document.getElementById(x).value.trim(); };
  if (id === "planForm") { ui.form = { age: v("pf-age"), dom: v("pf-dom"), th: v("pf-th"), min: Math.min(60, Math.max(10, +v("pf-min") || 25)), extra: v("pf-extra") }; ui.plan = makePlan(ui.form); render(); toast("Đã soạn xong. Bạn có thể sửa từng mục bên phải."); return; }
  if (id === "libForm") {
    var f = document.getElementById("lf-f").files[0], it = { id: uid(), t: v("lf-t"), th: v("lf-th"), ty: v("lf-ty"), n: v("lf-n"), s: v("lf-s") };
    var done = function () { S.lib.push(it); var ok = save(); render(); toast(ok ? "Đã thêm vào thư viện" : "Đã thêm, nhưng bộ nhớ trình duyệt đầy nên chưa lưu lâu dài"); };
    if (!f) { done(); return; }
    if (f.type.indexOf("video") === 0) { it.ty = "video"; it.vid = true; it.fn = f.name; MEDIA[it.id] = { url: URL.createObjectURL(f), file: f }; done(); return; }
    if (f.type.indexOf("image") === 0) { it.ty = "anh"; shrink(f, function (d) { if (d) it.m = d; done(); }); return; }
    it.fn = f.name; done(); return;
  }
  if (id === "profForm") { var idx = ensureKid(v("pr-k")); ui.kid = idx; S.prof.push({ k: idx, d: v("pr-d") || today(), t: v("pr-t"), ty: v("pr-ty"), n: v("pr-n") }); save(); render(); toast("Đã lưu vào hồ sơ của " + S.kids[idx]); return; }
  if (id === "chatForm") {
    var miss = chatMissing();
    if (miss.length) { toast("Còn thiếu: " + miss.join("; ")); return; }
    var c = ui.cf, stu = c.to === "kid";
    S.chat.push({ r: c.role, p: c.person.trim(), stu: stu, to: stu ? S.kids[findKid(c.kid)] : "Cả lớp", d: today(), x: c.x.trim() });
    c.x = ""; save(); render(); toast("Đã gửi"); return;
  }
  if (id === "kidForm") {
    var nm = v("kd-n");
    if (!nm) { toast("Hãy nhập tên học sinh"); return; }
    if (findKid(nm) >= 0) { toast(nm + " đã có trong bảng"); return; }
    ensureKid(nm); save(); render(); toast("Đã thêm " + nm + " vào bảng"); return;
  }
  if (id === "diaryForm") { S.diary.push({ d: v("dy-d") || today(), m: ui.mood, a: v("dy-a"), x: v("dy-x") }); save(); render(); toast("Đã ghi vào nhật ký"); return; }
});
render();
</script>
